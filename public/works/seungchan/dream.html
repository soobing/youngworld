<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최승찬의 나의 꿈은 — 영월드</title>
<!--
  ▶ 이 페이지는 영상 재생기다. 영상 자체는 ffmpeg 로 따로 만든다.
      ./tools/dream-film/build.sh seungchan
    → /works/seungchan/dream/dream.mp4  +  poster.jpg 가 생긴다.

  ▶ 아직 영상이 없으면 "준비 중" 안내가 대신 뜬다(깨진 화면이 보이지 않게).
-->
<style>
  :root{
    --ink:#1f2430; --muted:#5b6472; --accent:#ff7a2e; --accent2:#2b1b4d;
    --line:#2b3350; --dim:#9aa4bd;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;
    background:#0e1220; color:#fff; overflow:hidden;
  }
  .wrap{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2.4vmin; padding:3.5vmin 4vmin;
  }

  /* ---- 제목 ---- */
  .head{ text-align:center; }
  .who{ font-size:clamp(11px,1.9vmin,15px); font-weight:800; letter-spacing:.04em; color:var(--dim); }
  h1{ font-size:clamp(20px,3.8vmin,38px); line-height:1.2; margin-top:.6vmin; }
  h1 .star{ color:#ffd24a; }
  .logline{ margin-top:1vmin; font-size:clamp(12px,2vmin,17px); color:var(--dim); }

  /* ---- 영상 ---- */
  .stage{
    position:relative; width:min(100%,1180px); aspect-ratio:16/9;
    border-radius:16px; overflow:hidden; background:#000;
    border:1px solid var(--line); box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  video{ width:100%; height:100%; display:block; background:#000; }

  /* 재생 전 큰 버튼. 소리가 있는 영상이라 자동재생 대신 클릭으로 시작한다. */
  .play{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.6vmin;
    background:rgba(6,14,31,.45); border:none; cursor:pointer; color:#fff;
    font-family:inherit; transition:background .2s;
  }
  .play:hover{ background:rgba(6,14,31,.28); }
  .play .disc{
    width:clamp(56px,9vmin,86px); height:clamp(56px,9vmin,86px); border-radius:50%;
    background:var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:clamp(20px,3.4vmin,32px); padding-left:.4vmin;
    box-shadow:0 8px 26px rgba(255,122,46,.5);
  }
  .play .lbl{ font-size:clamp(12px,2vmin,16px); font-weight:800; }
  .play .sub{ font-size:clamp(10px,1.7vmin,13px); color:rgba(255,255,255,.72); margin-top:-1vmin; }
  .hidden{ display:none !important; }

  /* 다 보고 나면 뜨는 마무리 */
  .outro{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2vmin; text-align:center;
    background:linear-gradient(135deg,#2b1b4d,#ff7a2e); padding:5vmin;
  }
  .outro .quote{ font-size:clamp(14px,2.6vmin,25px); font-weight:800; line-height:1.45; }
  .outro .sig{ background:#fff; color:var(--accent2); font-weight:900; border-radius:12px; padding:9px 16px; font-size:clamp(12px,2vmin,17px); }
  .outro button{
    border:2px solid #fff; background:transparent; color:#fff; font-family:inherit;
    font-weight:800; font-size:clamp(12px,1.9vmin,15px); border-radius:10px;
    padding:9px 18px; cursor:pointer; transition:background .15s;
  }
  .outro button:hover{ background:rgba(255,255,255,.18); }

  /* 영상 파일이 아직 없을 때 */
  .todo{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.6vmin; text-align:center;
    background:repeating-linear-gradient(45deg,#151b2e,#151b2e 12px,#1a2137 12px,#1a2137 24px);
    color:#9aa4bd; padding:5vmin;
  }
  .todo .ic{ font-size:clamp(28px,5vmin,46px); }
  .todo b{ color:#fff; font-size:clamp(13px,2.2vmin,19px); }
  .todo code{
    display:inline-block; background:#0b1020; color:#ffd24a; border-radius:8px;
    padding:7px 12px; font-size:clamp(11px,1.8vmin,14px); margin-top:.6vmin;
  }

  /* ---- 장면 목록 ---- */
  .scenes{ display:flex; flex-wrap:wrap; gap:1vmin; justify-content:center; width:min(100%,1180px); }
  .scenes button{
    display:flex; align-items:center; gap:.9vmin;
    background:#1a2137; border:1px solid var(--line); color:#c7cee0;
    font-family:inherit; font-size:clamp(10px,1.75vmin,14px); font-weight:600;
    border-radius:10px; padding:.9vmin 1.5vmin; cursor:pointer; transition:all .15s;
  }
  .scenes button:hover{ background:#232c4a; color:#fff; }
  .scenes button.on{ background:var(--accent2); border-color:var(--accent); color:#fff; }
  .scenes .no{ color:var(--accent); font-weight:900; }
  .scenes button:disabled{ opacity:.4; cursor:default; }

  .foot{ font-size:clamp(10px,1.6vmin,13px); color:#5b6580; text-align:center; }
  .foot a{ color:#8f9bbd; }

  @media (max-width:700px){ .scenes button{ font-size:11px; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="who">🙋 최승찬</div>
    <h1><span class="star">⭐</span> 나의 꿈은</h1>
    <div class="logline">포기했던 코딩으로 다시 돌아오기까지, 26초</div>
  </div>

  <div class="stage">
    <video id="v" playsinline preload="metadata"
           poster="/works/seungchan/dream/poster.jpg">
      <source src="/works/seungchan/dream/dream.mp4" type="video/mp4">
    </video>

    <!-- 재생 전 -->
    <button class="play" id="play">
      <span class="disc">▶</span>
      <span class="lbl">재생하기</span>
      <span class="sub">소리를 켜고 보세요 · 26초</span>
    </button>

    <!-- 다 본 뒤 -->
    <div class="outro hidden" id="outro">
      <div class="quote">“사람이 좋아했던 일은,<br>잘 변하지 않더라”</div>
      <div class="sig">최승찬, 다시 시작하는 중 🚀</div>
      <button id="again">↺ 다시 보기</button>
    </div>

    <!-- 영상 파일이 아직 없을 때 -->
    <div class="todo hidden" id="todo">
      <div class="ic">🎬</div>
      <b>아직 영상이 없어요</b>
      <div>그림 5장을 <code>dream/frames/</code> 에 넣고 아래를 실행하세요.</div>
      <code>./tools/dream-film/build.sh seungchan</code>
    </div>
  </div>

  <!-- 장면 목록: 누르면 그 지점으로 점프 -->
  <div class="scenes" id="scenes"></div>

  <div class="foot">
    그림은 AI로 만들고, 영상은 <b>ffmpeg</b>로 이어 붙였습니다 ·
    음악 출처는 <a href="/works/seungchan/dream/credits.txt" target="_blank" rel="noopener">credits.txt</a>
  </div>
</div>

<script>
  // 장면 목록. build.sh 가 컷당 5초로 만들기 때문에 시작 시각은 0·5·10·15·20 이다.
  const SCENES = [
    '코딩을 처음 만난 날',
    '코딩이 싫어지다',
    'AI가 나타났다',
    '고1, 다시 도전',
    '언젠가, 사람들과 함께',
  ];
  const HOLD = 5; // 컷 하나가 보이는 시간(초) — build.sh 의 HOLD 와 같은 값

  const v = document.getElementById('v');
  const playBtn = document.getElementById('play');
  const outro = document.getElementById('outro');
  const todo = document.getElementById('todo');
  const scenesWrap = document.getElementById('scenes');

  // ---- 장면 버튼 만들기 ----
  const buttons = SCENES.map((title, i) => {
    const b = document.createElement('button');
    b.innerHTML = '<span class="no">' + (i + 1) + '</span>' + title;
    b.addEventListener('click', () => {
      v.currentTime = i * HOLD;
      outro.classList.add('hidden');
      playBtn.classList.add('hidden');
      v.play();
    });
    scenesWrap.appendChild(b);
    return b;
  });

  // ---- 재생/정지 ----
  playBtn.addEventListener('click', () => {
    playBtn.classList.add('hidden');
    outro.classList.add('hidden');
    v.play();
  });
  document.getElementById('again').addEventListener('click', () => {
    outro.classList.add('hidden');
    v.currentTime = 0;
    v.play();
  });
  // 영상 위를 누르면 일시정지/재개 (컨트롤바 없이도 조작되게)
  v.addEventListener('click', () => { if (v.paused) v.play(); else v.pause(); });

  v.addEventListener('ended', () => outro.classList.remove('hidden'));

  // ---- 지금 어느 장면인지 표시 ----
  v.addEventListener('timeupdate', () => {
    const i = Math.min(SCENES.length - 1, Math.floor(v.currentTime / HOLD));
    buttons.forEach((b, k) => b.classList.toggle('on', k === i));
  });

  // ---- 아직 영상 파일이 없을 때 ----
  let told = false;
  function showTodo() {
    if (told) return;
    told = true;
    playBtn.classList.add('hidden');
    outro.classList.add('hidden');
    todo.classList.remove('hidden');
    buttons.forEach((b) => { b.disabled = true; });
  }

  function checkNoSource() {
    if (v.error || v.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) showTodo();
  }
  v.addEventListener('error', checkNoSource, true);
  v.querySelector('source').addEventListener('error', checkNoSource);

  let tries = 0;
  const watch = setInterval(() => {
    if (told || v.readyState >= 1 || ++tries > 16) { clearInterval(watch); return; }
    checkNoSource();
  }, 500);

  fetch('/works/seungchan/dream/dream.mp4', { method: 'HEAD' })
    .then((r) => { if (r.status === 404) showTodo(); })
    .catch(() => { /* 네트워크 사정은 근거가 못 된다. 위 감시에 맡긴다 */ });
</script>
</body>
</html>
